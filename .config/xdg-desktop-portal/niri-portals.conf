# Portal backend routing for niri.
# The GNOME portal's FileChooser delegates to a GNOME session service that
# isn't running under niri, so it crashes ("Remote peer disconnected") and no
# save/open dialog appears. Route the file chooser to GTK, which stands alone.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
